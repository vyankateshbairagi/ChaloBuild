    <path d="M 13 11 L 21 16 L 15 16 L 20 22 L 12 16 L 16 16 Z" fill="#FFFFFF"/>
  </g>

  <!-- Brand Text -->
  <text x="46" y="27" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="-0.5">
    Chalo<tspan fill="url(#badgeGrad)">Build</tspan>
  </text>

  <text x="46" y="38" fill="#7DD3FC" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">
