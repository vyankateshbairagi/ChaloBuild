<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 48" fill="none">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="250" height="48" rx="12" fill="#090D16" stroke="url(#borderGrad)" stroke-width="1.2"/>
  
  <!-- Icon -->
  <g transform="translate(10, 8)">
    <path d="M 24 6 C 22 4 18 3 14 5 C 8 7 5 13 6 19 C 7 25 12 30 18 29 C 22 28 25 26 27 23" 
